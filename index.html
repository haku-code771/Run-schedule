<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11/28 駅伝 2.4km 挑戦ダッシュボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-active {
            border-bottom: 3px solid #f97316;
            color: #ea580c;
            font-weight: bold;
        }
        /* アニメーション用 */
        .completed-item {
            opacity: 0.6;
            text-decoration: line-through;
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-5 rounded-b-2xl shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <span class="inline-block bg-orange-600/60 text-xs px-2.5 py-1 rounded-full font-semibold tracking-wider uppercase mb-1">
                    大会当日: 11月28日
                </span>
                <h1 class="text-2xl font-black tracking-tight flex items-center gap-2">
                    🎽 駅伝2.4km ダッシュボード
                </h1>
            </div>
            <!-- プログレスサークル風カウンター -->
            <div class="bg-white/20 backdrop-blur-md rounded-2xl p-2.5 text-center min-w-[70px]">
                <div class="text-xs opacity-90 font-medium">達成度</div>
                <div id="progress-percent" class="text-xl font-bold leading-none mt-1">0%</div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- ステータス概要カード -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 grid grid-cols-3 gap-2 text-center">
            <div class="p-2 bg-slate-50 rounded-xl">
                <div class="text-[10px] text-slate-500 font-bold uppercase">ハーフ記録</div>
                <div class="text-sm font-bold text-slate-700 mt-0.5">2:25:00</div>
                <div class="text-[9px] text-slate-400">(6:51/km)</div>
            </div>
            <div class="p-2 bg-slate-50 rounded-xl">
                <div class="text-[10px] text-slate-500 font-bold uppercase">現在の2km MAX</div>
                <div class="text-sm font-bold text-slate-700 mt-0.5">11分40秒</div>
                <div class="text-[9px] text-slate-400">(5:50/km)</div>
            </div>
            <div class="p-2 bg-orange-50 border border-orange-200/60 rounded-xl">
                <div class="text-[10px] text-orange-600 font-bold uppercase">目標 2.4km</div>
                <div class="text-sm font-black text-orange-600 mt-0.5">12分00秒</div>
                <div class="text-[9px] text-orange-500 font-bold">(5:00/km)</div>
            </div>
        </section>

        <!-- タブ切り替えバー -->
        <div class="flex border-b border-slate-200 bg-white rounded-xl shadow-sm px-2 text-sm font-medium text-slate-500">
            <button onclick="switchTab('training')" id="tab-btn-training" class="flex-1 py-3 text-center tab-active flex items-center justify-center gap-1.5">
                <i data-lucide="calendar" class="w-4 h-4"></i> 練習メニュー
            </button>
            <button onclick="switchTab('strategy')" id="tab-btn-strategy" class="flex-1 py-3 text-center flex items-center justify-center gap-1.5">
                <i data-lucide="flag" class="w-4 h-4"></i> レース攻略
            </button>
        </div>

        <!-- ================= タブ1: 練習メニュー ================= -->
        <div id="tab-training" class="space-y-4">

            <!-- 全体進捗バー -->
            <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-100">
                <div class="flex justify-between text-xs text-slate-600 font-bold mb-1.5">
                    <span>全体トレーニング消化率</span>
                    <span id="progress-text">0 / 12 メニュー</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-orange-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>

            <!-- WEEK 1 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <div>
                        <span class="text-[11px] font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded-md">第1週</span>
                        <h2 class="text-base font-bold text-slate-800">スピードの基礎・動き作り</h2>
                    </div>
                    <span class="text-xs font-semibold text-slate-400">10/21〜10/27</span>
                </div>
                <p class="text-xs text-slate-500 italic">2km MAX（5:50/km）の壁を壊し、速い動きに神経を慣らす！</p>
                
                <div class="space-y-2">
                    <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 active:bg-slate-100 transition cursor-pointer">
                        <input type="checkbox" data-id="w1d1" onchange="toggleTask(this)" class="mt-1 w-5 h-5 accent-orange-500 rounded">
                        <div class="flex-1 text-xs">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>火：ショートインターバル</span>
                                <span class="text-orange-600 font-extrabold">400m × 5本</span>
                            </div>
                            <div class="text-slate-500 mt-0.5">目標: 1本1分55秒〜2分00秒 (4:45〜5:00/km) / つなぎジョグ2分</div>
                        </div>
                    </label>

                    <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 active:bg-slate-100 transition cursor-pointer">
                        <input type="checkbox" data-id="w1d2" onchange="toggleTask(this)" class="mt-1 w-5 h-5 accent-orange-500 rounded">
                        <div class="flex-1 text-xs">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>木：ベース構築＋刺激</span>
                                <span class="text-slate-600">3〜4km ジョグ</span>
                            </div>
                            <div class="text-slate-500 mt-0.5">仕上げに「流し（50mダッシュ）」× 3本でフォーム調整</div>
                        </div>
                    </label>

                    <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 active:bg-slate-100 transition cursor-pointer">
                        <input type="checkbox" data-id="w1d3" onchange="toggleTask(this)" class="mt-1 w-5 h-5 accent-orange-500 rounded">
                        <div class="flex-1 text-xs">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>土/日：持続走</span>
                                <span class="text-slate-600">5km 持続走</span>
                            </div>
                            <div class="text-slate-500 mt-0.5">目安: 5:30〜6:00/km（少し余裕のあるペースを維持）</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- WEEK 2 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <div>
                        <span class="text-[11px] font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded-md">第2週</span>
                        <h2 class="text-base font-bold text-slate-800">実践的なペース走</h2>
                    </div>
                    <span class="text-xs font-semibold text-slate-400">10/28〜11/3</span>
                </div>
                <p class="text-xs text-slate-500 italic">2.4kmの距離を意識。長めの距離を目標ペースに寄せる！</p>

                <div class="space-y-2">
                    <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 active:bg-slate-100 transition cursor-pointer">
                        <input type="checkbox" data-id="w2d1" onchange="toggleTask(this)" class="mt-1 w-5 h-5 accent-orange-500 rounded">
                        <div class="flex-1 text-xs">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>火：レペティション</span>
                                <span class="text-orange-600 font-extrabold">1km × 2本</span>
                            </div>
                            <div class="text-slate-500 mt-0.5">目標: 1本5分10秒〜5分20秒 (休憩3分)</div>
                        </div>
                    </label>

                    <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 active:bg-slate-100 transition cursor-pointer">
                        <input type="checkbox" data-id="w2d2" onchange="toggleTask(this)" class="mt-1 w-5 h-5 accent-orange-500 rounded">
                        <div class="flex-1 text-xs">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>木：ミドルペース走</span>
                                <span class="text-slate-600">3km ペース走</span>
                            </div>
                            <div class="text-slate-500 mt-0.5">目安: 5:40〜5:50/km (失速せずに一定ペースで走る)</div>
                        </div>
                    </label>

                    <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 active:bg-slate-100 transition cursor-pointer">
                        <input type="checkbox" data-id="w2d3" onchange="toggleTask(this)" class="mt-1 w-5 h-5 accent-orange-500 rounded">
